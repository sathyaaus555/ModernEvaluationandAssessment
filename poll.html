<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Polls · Modern Evaluation & Assessment</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#15233c;background:#f4f7fd}*{box-sizing:border-box}body{margin:0}header{background:#10213c;color:white;padding:22px max(20px,calc((100vw - 1060px)/2))}header a{color:#a9f6ed;font-size:14px;text-decoration:none}.brand{font-size:13px;letter-spacing:.13em;font-weight:800;color:#62e5d6}.wrap{max-width:900px;padding:38px 20px 80px;margin:auto}h1{font-size:clamp(32px,5vw,50px);margin:8px 0 12px;line-height:1.1}h2{font-size:25px}p{line-height:1.6}.muted{color:#60718a}.card{background:white;border:1px solid #dee7f5;border-radius:18px;padding:28px;margin:20px 0;box-shadow:0 8px 28px #233c5b0a}.kicker{font-weight:800;color:#2965db;font-size:13px;text-transform:uppercase;letter-spacing:.07em}.options{display:grid;gap:12px;margin:22px 0}.option{padding:18px;text-align:left;border:2px solid #d7e3f2;background:#f8fbff;border-radius:12px;font:inherit;cursor:pointer}.option:hover,.option.selected{border-color:#2568e5;background:#e9f2ff}.option:disabled{cursor:default;opacity:.8}button.primary{background:#2165df;color:white;border:0;border-radius:11px;padding:13px 21px;font-weight:750;font-size:16px;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:white;color:#1e55b0;border:1px solid #aec7ee;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}button{font-family:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #73c6ec;outline-offset:3px}button.danger{background:#fef1f0;color:#a12828;border:1px solid #f1b7b7;border-radius:10px;padding:10px 14px;cursor:pointer}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#e7f6f0;color:#176e53;border-radius:999px;padding:5px 11px;font-weight:750;font-size:13px}.hidden{display:none!important}.message{padding:15px;border-radius:10px;background:#eaf1ff;color:#174178;margin:15px 0}.error{background:#fff0eb;color:#943b23}.poll-card{border:1px solid #d7e3f2;border-radius:12px;padding:16px;margin:12px 0}.poll-card strong{display:block;margin-bottom:9px}.bar{height:15px;border-radius:20px;background:#e7edf7;overflow:hidden;margin:5px 0 14px}.fill{height:100%;background:#2673dd;transition:width .3s}input{padding:12px;border:1px solid #bdcae1;border-radius:10px;font:inherit;max-width:100%;width:300px}.small{font-size:13px}.foot{font-size:14px;color:#5b6c82;margin-top:30px}@media(max-width:600px){.card{padding:20px}.wrap{padding-top:25px}}
</style></head><body>
<header><div class="brand">ASSESSMENT LAB · LIVE PARTICIPATION</div><div class="row" style="justify-content:space-between"><strong>Modern Evaluation & Assessment Frameworks</strong></div></header>
<div class="wrap"><h1>Final knowledge check</h1><p id="intro" class="muted">When the presenter launches the poll, answer all four questions and submit your answers together.</p>
<div id="status" class="message" role="status" aria-live="polite">Connecting…</div>
<section id="presenter" class="card hidden"><h2>Presenter controls</h2><div id="login"><input id="email" type="email" placeholder="Presenter email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="sign-in" class="primary">Sign in</button></div><div id="controls" class="hidden"><div class="row"><button id="launch" class="primary">Launch poll</button><button id="close" class="secondary">End & hide poll</button><button id="sign-out" class="danger">Sign out</button></div></div></section>
<section id="participant" class="hidden"><form id="questionnaire"><div id="questions"></div><button id="submit" class="primary" disabled>Submit answers</button></form><p id="feedback" role="status"></p></section>
<section id="results" class="card hidden"><h2>Live results</h2><p id="count"></p><div id="bars"></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="poll-config.js?v=20261123b"></script>
<script>
"use strict";
const QUESTIONS=[
{id:"topic02",q:"An AI-generated answer sounds confident. What should we do?",options:["Trust it because it is fluent","Verify it against reliable course material"]},
{id:"topic03",q:"Which prompt is more likely to generate a useful, well-structured assessment?",options:["Create four questions about Python.","Act as an assessment designer. For first-year Python students, create three Apply-level MCQs on for-loops, using only basic Python, with answers and explanations in a table."]},
{id:"topic04",q:"An AI-generated assessment question includes a fact you are unsure about. What should you do?",options:["Trust it because AI sounds confident.","Verify the fact using reliable sources before using the question."]},
{id:"topic05",q:"Before sharing any information with an AI tool, what should you consider first?",options:["Whether the AI tool can generate a quick response.","Whether the information is safe to share and complies with institutional policies."]}
];

const PRESENTER_UID="4Tl4luSiUCN2KHBmtjUPA2jP1mA2";
const $=id=>document.getElementById(id);
const isPresenter=new URLSearchParams(location.search).has("presenter");
const POLL="final04";
const conf=window.ASSESSMENT_POLL_FIREBASE;
const say=(s,bad=false)=>{$("status").textContent=s;$("status").classList.toggle("error",bad)};
const show=(id,on)=>$(id).classList.toggle("hidden",!on);
if(isPresenter){show("presenter",true);$("intro").textContent="Launch all four questions together and view live responses."}
if(!conf||!conf.apiKey||conf.apiKey==="REPLACE_ME"){say("Firebase is not configured.",true)}else{
try{
firebase.initializeApp(conf);const auth=firebase.auth(),db=firebase.database();
let user=null,current=null,votes={},mine=null,ready=false,busy=false,sessionRef=null,voteRef=null;
const host=()=>isPresenter&&user?.uid===PRESENTER_UID;
const open=()=>current?.id===POLL&&current.status==="open";
const inputs=()=>Array.from(document.querySelectorAll("#questions input"));
QUESTIONS.forEach((q,i)=>{const field=document.createElement("fieldset");field.className="card";field.style.minWidth="0";const legend=document.createElement("legend");legend.style.fontWeight="750";legend.textContent=(i+1)+". "+q.q;field.append(legend);q.options.forEach((opt,j)=>{const label=document.createElement("label");label.className="option";label.style.display="flex";label.style.alignItems="flex-start";label.style.gap="12px";label.style.margin="10px 0";const input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=String(j);input.required=true;input.style.width="auto";input.style.flexShrink="0";label.append(input,document.createTextNode(String.fromCharCode(65+j)+". "+opt));field.append(label)});$("questions").append(field)});
const answers=()=>QUESTIONS.map((q,i)=>document.querySelector('input[name="q'+i+'"]:checked')?.value);
function render(){
 const live=open();show("participant",!isPresenter&&live);show("results",host()&&current?.id===POLL);
 say(!user?"Sign in to continue.":live?"Poll is live.":current?.id===POLL?"Poll is closed.":"Waiting for the presenter to launch the poll…");
 if(!isPresenter&&live){if(mine){inputs().forEach(x=>{x.checked=mine[Number(x.name.slice(1))]===x.value});$("feedback").textContent="Thank you! Your answers have been submitted."}inputs().forEach(x=>x.disabled=!!mine||busy||!ready);$("submit").disabled=!!mine||busy||!ready||answers().some(x=>x===undefined)}
 if(host()){ $("launch").disabled=live; $("close").disabled=!live;const vals=Object.values(votes).filter(v=>typeof v==="string"&&/^[01]{4}$/.test(v));$("count").textContent=vals.length+" completed responses";const bars=$("bars");bars.replaceChildren();QUESTIONS.forEach((q,i)=>{const card=document.createElement("div");card.className="poll-card";const title=document.createElement("strong");title.textContent=(i+1)+". "+q.q;card.append(title);q.options.forEach((opt,j)=>{const n=vals.filter(v=>v[i]===String(j)).length,p=vals.length?Math.round(n*100/vals.length):0;const label=document.createElement("div");label.textContent=String.fromCharCode(65+j)+". "+opt+" — "+p+"% ("+n+")";const bar=document.createElement("div"),fill=document.createElement("div");bar.className="bar";fill.className="fill";fill.style.width=p+"%";bar.append(fill);card.append(label,bar)});bars.append(card)})}
}
$("questionnaire").onchange=render;
$("questionnaire").onsubmit=async e=>{e.preventDefault();if(!open()||!user||mine||busy||!ready)return;const a=answers();if(a.some(x=>x===undefined))return;busy=true;render();try{await db.ref("votes/"+POLL+"/"+user.uid).set(a.join(""));mine=a.join("");$("feedback").textContent="Thank you! Your answers have been submitted."}catch(e){$("feedback").textContent="Could not submit: "+e.message}finally{busy=false;render()}};
$("launch").onclick=async()=>{try{await db.ref("session/current").set({id:POLL,status:"open",resultsVisible:false})}catch(e){say(e.message,true)}};
$("close").onclick=async()=>{try{await db.ref("session/current").update({status:"closed"})}catch(e){say(e.message,true)}};
$("sign-in").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value,$("password").value)}catch(e){say(e.message,true)}};
$("sign-out").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{if(sessionRef)sessionRef.off();if(voteRef)voteRef.off();user=u;current=null;votes={};mine=null;ready=false;busy=false;show("controls",host());show("login",!host());if(!u){render();if(!isPresenter){try{await auth.signInAnonymously()}catch(e){say(e.message,true)}}return}if(isPresenter&&!host()){say("Sign in with the authorised presenter account.",true);return}sessionRef=db.ref("session/current");sessionRef.on("value",s=>{current=s.val();render()},e=>say(e.message,true));voteRef=db.ref("votes/"+POLL+(host()?"":"/"+u.uid));voteRef.on("value",s=>{if(host())votes=s.val()||{};else mine=s.val();ready=true;render()},e=>say(e.message,true));render()});
}catch(e){say(e.message,true)}}
</script></body></html>
